name: Windows and macOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Create an isolated test keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/gemini-local-test.keychain-db"
          security create-keychain -p ci-fixture-only "$keychain"
          security unlock-keychain -p ci-fixture-only "$keychain"
          echo "GEMINI_TEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: python gemini_terminal.py --help
      - name: Check macOS launcher syntax
        if: runner.os == 'macOS'
        run: bash -n Gemini.command
      - name: Remove the isolated test keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${GEMINI_TEST_KEYCHAIN:-}" = "$RUNNER_TEMP/gemini-local-test.keychain-db" ]; then
            security delete-keychain "$GEMINI_TEST_KEYCHAIN"
          fi
